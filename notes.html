  <link rel="stylesheet" href="css/style.css">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23C67B5C'/></svg>">

  <style>
    .notes-page {
      padding-top: 120px;
      padding-bottom: 6rem;
      min-height: 100vh;
      background: var(--bg-cream);
    }

    .notes-page-header {
      margin-bottom: 3rem;
    }

    .notes-page-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-mid);
      margin-bottom: 2rem;
      transition: color 0.3s var(--ease);
    }

    .notes-page-back:hover {
      color: var(--accent);
    }

    .notes-page-title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--text-dark);
      margin-bottom: 1rem;
    }

    .notes-page-title span {
      font-style: italic;
      color: var(--accent);
      font-weight: 500;
    }

    .notes-page-desc {
      font-size: 1.0625rem;
      color: var(--text-mid);
      max-width: 500px;
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .note-item {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 2rem;
      align-items: center;
      padding: 2rem;
      background: var(--bg-cream-2);
      border-radius: 1rem;
      border: 1px solid rgba(26, 23, 20, 0.05);
      transition: all 0.4s var(--ease);
      cursor: pointer;
    }

    .note-item:hover {
      border-color: rgba(198, 123, 92, 0.2);
      box-shadow: 0 8px 30px rgba(26, 23, 20, 0.06);
      transform: translateY(-2px);
    }

    .note-item-date {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .note-item-day {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 500;
      color: var(--text-dark);
      line-height: 1;
    }

    .note-item-month {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-top: 0.25rem;
    }

    .note-item-body {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .note-item-tags {
      display: flex;
      gap: 0.375rem;
      flex-wrap: wrap;
    }

    .note-item-tag {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      color: var(--text-light);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .note-item-title {
      font-family: var(--font-display);
      font-size: 1.375rem;
      font-weight: 500;
      color: var(--text-dark);
      line-height: 1.4;
    }

    .note-item-excerpt {
      font-size: 0.875rem;
      color: var(--text-mid);
      line-height: 1.6;
    }

    .note-item-arrow {
      font-size: 1.25rem;
      color: var(--text-light);
      transition: all 0.3s var(--ease);
    }

    .note-item:hover .note-item-arrow {
      color: var(--accent);
      transform: translateX(4px);
    }

    .note-item-link {
      text-decoration: none;
      color: inherit;
    }

    .notes-admin-link {
      text-align: center;
      margin-top: 3.5rem;
    }

    .notes-admin-link a {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-light);
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.3s var(--ease);
    }

    .notes-admin-link a:hover {
      color: var(--accent);
    }

    @media (max-width: 768px) {
      .note-item {
        grid-template-columns: 60px 1fr;
        gap: 1rem;
        padding: 1.5rem;
      }
      .note-item-arrow { display: none; }
      .note-item-day { font-size: 2rem; }
    }
  </style>
</head>
<body>

    <a href="index.html#projects" class="mobile-menu-link"><span>03</span>作品</a>

  <section class="notes-page">
    <div class="container">
      <div class="notes-page-header">
        <a href="index.html" class="notes-page-back" data-cursor="hover">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
