<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记</title>
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="1peed — 探索笔记">
  <meta property="og:title" id="ogTitle" content="探索笔记">
  <meta property="og:description" id="ogDesc" content="记录思考的过程，而非结论。">
  <meta name="description" id="metaDesc" content="记录思考的过程，而非结论。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%234A7BA6'/></svg>">

  <style>
    .note-page {
      padding-top: 120px;
      padding-bottom: 6rem;
      min-height: 100vh;
      background: var(--bg-cream);
    }

    .note-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .note-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-mid);
      text-decoration: none;
      margin-bottom: 2.5rem;
      transition: color 0.3s var(--ease);
    }

    .note-back:hover {
      color: var(--accent);
    }

    .note-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .note-tag {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.75rem;
      background: rgba(74, 123, 166, 0.08);
      border-radius: 2rem;
    }

    .note-date {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-light);
    }

    .note-reading {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-light);
    }

    .note-reading::before {
      content: "·";
      margin-right: 1rem;
    }

    .note-title {
      font-family: var(--font-display);
      font-size: clamp(1.875rem, 5vw, 3rem);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--text-dark);
      margin-bottom: 2rem;
    }

    .note-divider {
      width: 48px;
      height: 2px;
      background: var(--accent);
      margin-bottom: 2.5rem;
    }

    /* ---- 正文排版 ---- */
    .prose {
      font-size: 1.0625rem;
      line-height: 1.9;
      color: var(--text-dark);
    }

    .prose h1, .prose h2, .prose h3, .prose h4 {
      font-family: var(--font-display);
      color: var(--text-dark);
      line-height: 1.3;
    }

    .prose h1 { font-size: 2rem; margin: 3rem 0 1.25rem; font-weight: 600; }
    .prose h2 { font-size: 1.625rem; margin: 2.75rem 0 1rem; font-weight: 600; }
    .prose h3 { font-size: 1.25rem; margin: 2.25rem 0 0.875rem; font-weight: 600; }
    .prose h4 { font-size: 1.0625rem; margin: 2rem 0 0.75rem; font-weight: 600; }

    .prose p { margin: 1.125rem 0; }

    .prose ul, .prose ol {
      padding-left: 1.5rem;
      margin: 1.125rem 0;
    }

    .prose li { margin: 0.375rem 0; }
    .prose li::marker { color: var(--accent); }

    .prose strong { font-weight: 600; }

    .prose a {
      color: var(--accent-dim);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s;
    }

    .prose a:hover { color: var(--accent); }

    .prose blockquote {
      margin: 1.75rem 0;
      padding: 1rem 1.5rem;
      border-left: 3px solid var(--accent);
      background: var(--bg-cream-2);
      border-radius: 0 0.75rem 0.75rem 0;
      color: var(--text-mid);
      font-style: italic;
    }

    .prose blockquote p { margin: 0.25rem 0; }

    .prose code {
      font-family: var(--font-mono);
      font-size: 0.875em;
      background: var(--bg-cream-3);
      padding: 0.15em 0.45em;
      border-radius: 0.35rem;
    }

    .prose pre {
      background: var(--bg-dark);
      color: var(--text-cream);
      padding: 1.25rem 1.5rem;
      border-radius: 0.75rem;
      overflow-x: auto;
      margin: 1.75rem 0;
      line-height: 1.6;
    }

    .prose pre code {
      background: none;
      padding: 0;
      color: inherit;
      font-size: 0.875rem;
    }

    .prose img {
      max-width: 100%;
      border-radius: 0.75rem;
      margin: 1.75rem 0;
    }

    .prose hr {
      border: none;
      border-top: 1px solid rgba(26, 23, 20, 0.1);
      margin: 2.5rem 0;
    }

    .prose table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.75rem 0;
      font-size: 0.9375rem;
    }

    .prose th, .prose td {
      padding: 0.625rem 0.875rem;
      border: 1px solid rgba(26, 23, 20, 0.1);
      text-align: left;
    }

    .prose th {
      background: var(--bg-cream-2);
      font-weight: 600;
    }

    /* ---- 状态提示 ---- */
    .note-state {
      text-align: center;
      padding: 6rem 0;
      color: var(--text-light);
      font-size: 0.9375rem;
    }

    .note-state-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--text-mid);
      margin-bottom: 0.75rem;
    }

    /* ---- 底部导航 ---- */
    .note-footer-nav {
      margin-top: 5rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(26, 23, 20, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.5rem;
    }

    .note-prevnext {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      max-width: 45%;
      text-decoration: none;
    }

    .note-prevnext-dir {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      color: var(--text-light);
      letter-spacing: 0.08em;
    }

    .note-prevnext-title {
      font-size: 0.9375rem;
      color: var(--text-mid);
      line-height: 1.45;
      transition: color 0.3s var(--ease);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .note-prevnext:hover .note-prevnext-title {
      color: var(--accent);
    }

    .note-prevnext.next {
      text-align: right;
      margin-left: auto;
    }

    .note-footer-nav .note-back-list {
      font-size: 0.8125rem;
      color: var(--text-light);
      text-decoration: none;
      white-space: nowrap;
      padding-top: 0.15rem;
      transition: color 0.3s var(--ease);
    }

    .note-footer-nav .note-back-list:hover {
      color: var(--accent);
    }

    @media (max-width: 600px) {
      .note-footer-nav {
        flex-direction: column;
        gap: 1.25rem;
      }
      .note-prevnext {
        max-width: 100%;
      }
      .note-prevnext.next {
        text-align: left;
        margin-left: 0;
      }
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="grain"></div>

  <nav class="nav scrolled" id="nav">
    <a href="index.html" class="nav-logo" data-cursor="hover">
      <span class="nav-logo-mark"></span>
    </a>
    <div class="nav-links">
      <a href="index.html#about" class="nav-link" data-cursor="hover"><span class="nav-link-num">01</span> 关于</a>
      <a href="index.html#experience" class="nav-link" data-cursor="hover"><span class="nav-link-num">02</span> 经历</a>
      <a href="index.html#projects" class="nav-link" data-cursor="hover"><span class="nav-link-num">03</span> 作品</a>
      <a href="notes.html" class="nav-link" data-cursor="hover"><span class="nav-link-num">04</span> 笔记</a>
      <a href="index.html#contact" class="nav-link" data-cursor="hover"><span class="nav-link-num">05</span> 联系</a>
    </div>
    <div class="nav-menu-btn" id="navMenuBtn">
      <span></span><span></span>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html#about" class="mobile-menu-link"><span>01</span>关于</a>
    <a href="index.html#experience" class="mobile-menu-link"><span>02</span>经历</a>
    <a href="index.html#projects" class="mobile-menu-link"><span>03</span>作品</a>
    <a href="notes.html" class="mobile-menu-link"><span>04</span>笔记</a>
    <a href="index.html#contact" class="mobile-menu-link"><span>05</span>联系</a>
  </div>

  <section class="note-page">
    <div class="note-container">
      <a href="notes.html" class="note-back" data-cursor="hover">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>全部笔记</span>
      </a>

      <div id="noteState" class="note-state">加载中…</div>

      <article id="noteArticle" style="display:none;">
        <div class="note-meta">
          <span class="note-tag" id="noteTag"></span>
          <span class="note-date" id="noteDate"></span>
          <span class="note-reading" id="noteReading"></span>
        </div>
        <h1 class="note-title" id="noteTitle"></h1>
        <div class="note-divider"></div>
        <div class="prose" id="noteContent"></div>

        <div class="note-footer-nav" id="noteFooterNav">
          <a href="notes.html" class="note-back-list" data-cursor="hover">← 全部笔记</a>
        </div>
      </article>
    </div>
  </section>

  <script src="content.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/main.js"></script>
  <script>
    (async function () {
      const stateEl = document.getElementById('noteState');
      const articleEl = document.getElementById('noteArticle');

      function showError(title, msg) {
        stateEl.style.display = '';
        stateEl.innerHTML =
          '<div class="note-state-title">' + title + '</div>' +
          '<div>' + msg + '</div>';
        articleEl.style.display = 'none';
      }

      const id = new URLSearchParams(window.location.search).get('id');
      if (!id) {
        showError('缺少笔记 ID', '链接似乎不完整，请从笔记列表页进入。');
        return;
      }

      if (typeof DB === 'undefined' || !DB.ready) {
        showError('数据库未配置', '这篇笔记存放在在线数据库里，但当前网站还没完成数据库配置。');
        return;
      }

      try {
        const note = await DB.get(id);
        document.title = note.title + ' — 探索笔记';
        document.getElementById('noteTag').textContent = note.tag || '笔记';
        document.getElementById('noteDate').textContent = note.dateText;
        if (note.readingMinutes) {
          document.getElementById('noteReading').textContent = '约 ' + note.readingMinutes + ' 分钟';
        }
        document.getElementById('noteTitle').textContent = note.title;

        // 更新分享卡片信息（微信/QQ 转发时显示）
        const desc = note.excerpt || (note.content || '').replace(/[#*`>\-\n]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
        document.getElementById('ogTitle').setAttribute('content', note.title);
        document.getElementById('ogDesc').setAttribute('content', desc);
        document.getElementById('metaDesc').setAttribute('content', desc);

        document.getElementById('noteContent').innerHTML = renderMarkdown(note.content);
        stateEl.style.display = 'none';
        articleEl.style.display = '';

        // 上一篇 / 下一篇（列表按时间倒序：i-1 是更新的，i+1 是更早的）
        try {
          const all = await DB.listPublished();
          const idx = all.findIndex(n => String(n.id) === String(id));
          if (idx !== -1) {
            const nav = document.getElementById('noteFooterNav');
            const older = all[idx + 1];  // 上一篇（更早发布）
            const newer = all[idx - 1];  // 下一篇（更新发布）
            let html = '';
            if (older) {
              html += '<a href="note.html?id=' + older.id + '" class="note-prevnext" data-cursor="hover">' +
                '<span class="note-prevnext-dir">← 上一篇</span>' +
                '<span class="note-prevnext-title">' + older.title + '</span></a>';
            } else {
              html += '<span></span>';
            }
            html += '<a href="notes.html" class="note-back-list" data-cursor="hover">全部笔记</a>';
            if (newer) {
              html += '<a href="note.html?id=' + newer.id + '" class="note-prevnext next" data-cursor="hover">' +
                '<span class="note-prevnext-dir">下一篇 →</span>' +
                '<span class="note-prevnext-title">' + newer.title + '</span></a>';
            }
            nav.innerHTML = html;
          }
        } catch (navErr) {
          console.warn('加载上下篇导航失败', navErr);
        }
      } catch (e) {
        console.warn(e);
        showError('笔记不存在或已删除', '它可能已经被移除，回到列表看看其他笔记吧。');
      }
    })();
  </script>
</body>
</html>
