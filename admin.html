<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记后台</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23C67B5C'/></svg>">

  <style>
    :root {
      --bg-cream: #FDFBF7;
      --bg-cream-2: #F7F1E8;
      --bg-cream-3: #EFE6D7;
      --text-dark: #1A1714;
      --text-mid: #5C544A;
      --text-light: #8A8074;
      --accent: #C67B5C;
      --accent-dim: #A86547;
      --danger: #B5543A;
      --ok: #6B8F5E;
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'Inter', -apple-system, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --ease: cubic-bezier(0.65, 0, 0.35, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--bg-cream);
      color: var(--text-dark);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent-dim); }

    /* ---- 登录 ---- */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 1px solid rgba(26, 23, 20, 0.08);
      border-radius: 1.25rem;
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(26, 23, 20, 0.06);
    }

    .login-title {
      font-family: var(--font-display);
      font-size: 1.625rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
    }

    .login-sub {
      font-size: 0.875rem;
      color: var(--text-light);
      margin-bottom: 2rem;
    }

    .field { margin-bottom: 1.125rem; }

    .field label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 0.5rem;
    }

    .field input[type="text"],
    .field input[type="email"],
    .field input[type="password"],
    .field textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      font-family: var(--font-body);
      font-size: 0.9375rem;
      color: var(--text-dark);
      background: var(--bg-cream-2);
      border: 1px solid rgba(26, 23, 20, 0.08);
      border-radius: 0.625rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--accent);
      background: #fff;
    }

    .field textarea {
      resize: vertical;
      line-height: 1.7;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-family: var(--font-body);
      font-size: 0.9375rem;
      font-weight: 500;
      border: none;
      border-radius: 0.625rem;
      cursor: pointer;
      transition: all 0.25s var(--ease);
      text-decoration: none;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dim); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      color: var(--text-mid);
      border: 1px solid rgba(26, 23, 20, 0.15);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(181, 84, 58, 0.3);
    }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .btn-block { width: 100%; }

    .login-error {
      display: none;
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(181, 84, 58, 0.08);
      border-radius: 0.5rem;
      color: var(--danger);
      font-size: 0.875rem;
    }

    .setup-tip {
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--bg-cream-2);
      border-radius: 0.625rem;
      font-size: 0.8125rem;
      color: var(--text-mid);
      line-height: 1.7;
    }

    /* ---- 后台主界面 ---- */
    .admin-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: #fff;
      border-bottom: 1px solid rgba(26, 23, 20, 0.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .admin-topbar-title {
      font-family: var(--font-display);
      font-size: 1.125rem;
      font-weight: 500;
    }

    .admin-topbar-title span { color: var(--accent); font-style: italic; }

    .admin-topbar-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .btn-sm {
      padding: 0.5rem 1rem;
      font-size: 0.8125rem;
    }

    .admin-shell {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 0;
      min-height: calc(100vh - 61px);
    }

    /* 列表侧栏 */
    .admin-list {
      background: var(--bg-cream-2);
      border-right: 1px solid rgba(26, 23, 20, 0.08);
      padding: 1.25rem;
      overflow-y: auto;
    }

    .admin-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .admin-list-title {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-light);
    }

    .admin-note-item {
      display: block;
      width: 100%;
      text-align: left;
      background: #fff;
      border: 1px solid rgba(26, 23, 20, 0.06);
      border-radius: 0.75rem;
      padding: 0.875rem 1rem;
      margin-bottom: 0.625rem;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      font-family: var(--font-body);
    }

    .admin-note-item:hover {
      border-color: rgba(198, 123, 92, 0.3);
    }

    .admin-note-item.active {
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(198, 123, 92, 0.12);
    }

    .admin-note-item-title {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-dark);
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .note-status-dot {
      flex-shrink: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 5px;
      background: var(--ok);
    }

    .note-status-dot.draft { background: var(--text-light); }

    .admin-note-item-meta {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      color: var(--text-light);
      margin-top: 0.375rem;
    }

    .admin-list-empty {
      text-align: center;
      color: var(--text-light);
      font-size: 0.8125rem;
      padding: 2rem 0.5rem;
    }

    /* 编辑区 */
    .admin-editor {
      padding: 1.75rem;
      max-width: 860px;
    }

    .editor-row {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 1rem;
    }

    .editor-content-area {
      position: relative;
    }

    .editor-textarea {
      min-height: 380px;
      font-family: var(--font-mono);
      font-size: 0.875rem;
    }

    .editor-preview {
      display: none;
      min-height: 380px;
      padding: 1rem 1.25rem;
      background: #fff;
      border: 1px solid rgba(26, 23, 20, 0.08);
      border-radius: 0.625rem;
      font-size: 0.9375rem;
      line-height: 1.8;
      overflow-y: auto;
    }

    .editor-preview.show { display: block; }
    .editor-preview.hide-textarea + textarea { display: none; }

    .editor-preview h1, .editor-preview h2, .editor-preview h3 {
      font-family: var(--font-display);
      margin: 1.5rem 0 0.75rem;
      line-height: 1.3;
    }
    .editor-preview h1 { font-size: 1.5rem; }
    .editor-preview h2 { font-size: 1.3rem; }
    .editor-preview h3 { font-size: 1.1rem; }
    .editor-preview p { margin: 0.75rem 0; }
    .editor-preview ul, .editor-preview ol { padding-left: 1.5rem; margin: 0.75rem 0; }
    .editor-preview blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem;
      background: var(--bg-cream-2);
      color: var(--text-mid);
      font-style: italic;
      margin: 1rem 0;
      border-radius: 0 0.5rem 0.5rem 0;
    }
    .editor-preview code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background: var(--bg-cream-3);
      padding: 0.15em 0.4em;
      border-radius: 0.3rem;
    }
    .editor-preview pre {
      background: #1A1714;
      color: #FDFBF7;
      padding: 1rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      margin: 1rem 0;
    }
    .editor-preview pre code { background: none; padding: 0; color: inherit; }
    .editor-preview img { max-width: 100%; border-radius: 0.5rem; }
    .editor-preview table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    .editor-preview th, .editor-preview td { border: 1px solid rgba(26,23,20,0.12); padding: 0.5rem 0.75rem; font-size: 0.875rem; }
    .editor-preview th { background: var(--bg-cream-2); }

    .editor-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.25rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .publish-toggle {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      cursor: pointer;
      user-select: none;
      font-size: 0.875rem;
      color: var(--text-mid);
    }

    .publish-toggle input { display: none; }

    .toggle-track {
      width: 40px;
      height: 22px;
      background: var(--bg-cream-3);
      border-radius: 22px;
      position: relative;
      transition: background 0.25s var(--ease);
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.25s var(--ease);
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    .publish-toggle input:checked + .toggle-track { background: var(--ok); }
    .publish-toggle input:checked + .toggle-track::after { transform: translateX(18px); }

    .editor-actions {
      display: flex;
      gap: 0.625rem;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text-dark);
      color: var(--bg-cream);
      padding: 0.75rem 1.5rem;
      border-radius: 2rem;
      font-size: 0.875rem;
      opacity: 0;
      transition: all 0.35s var(--ease);
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.error { background: var(--danger); }
    .toast.ok { background: var(--ok); }

    .editor-hint {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      color: var(--text-light);
      margin-top: 0.5rem;
    }

    @media (max-width: 860px) {
      .admin-shell { grid-template-columns: 1fr; }
      .admin-list {
        border-right: none;
        border-bottom: 1px solid rgba(26, 23, 20, 0.08);
        max-height: 260px;
      }
      .editor-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- 登录视图 -->
  <div class="login-wrap" id="loginView" style="display:none;">
    <div class="login-card">
      <div class="login-title">笔记后台</div>
      <div class="login-sub">登录后即可发布和编辑探索笔记</div>

      <div class="field">
        <label>邮箱</label>
        <input type="email" id="loginEmail" placeholder="你在 Supabase 设置的邮箱" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn btn-primary btn-block" id="loginBtn">登 录</button>

      <div class="login-error" id="loginError"></div>

      <div class="setup-tip" id="setupTip" style="display:none;">
        还没配置数据库。打开项目里的《笔记后台-配置指南.md》，按步骤注册 Supabase 并把密钥填进 content.js，大约 10 分钟。
      </div>
    </div>
  </div>

  <!-- 后台主视图 -->
  <div id="adminView" style="display:none;">
    <div class="admin-topbar">
      <div class="admin-topbar-title">笔记<span>后台</span></div>
      <div class="admin-topbar-actions">
        <a class="btn btn-ghost btn-sm" href="notes.html" target="_blank">查看网站</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">退出</button>
      </div>
    </div>

    <div class="admin-shell">
      <!-- 笔记列表 -->
      <aside class="admin-list">
        <div class="admin-list-header">
          <span class="admin-list-title">全部笔记</span>
          <button class="btn btn-primary btn-sm" id="newNoteBtn">＋ 新笔记</button>
        </div>
        <div id="adminNotesList">
          <div class="admin-list-empty">加载中…</div>
        </div>
      </aside>

      <!-- 编辑器 -->
      <main class="admin-editor">
        <div class="editor-row">
          <div class="field">
            <label>标题</label>
            <input type="text" id="editTitle" placeholder="这篇笔记叫什么">
          </div>
          <div class="field">
            <label>标签</label>
            <input type="text" id="editTag" placeholder="如：自我探索">
          </div>
        </div>

        <div class="field">
          <label>摘要（显示在列表里的一两句话）</label>
          <input type="text" id="editExcerpt" placeholder="一句话说说这篇笔记讲了什么">
        </div>

        <div class="field">
          <label>正文（支持 Markdown） <a href="https://www.markdownguide.org/basic-syntax/" target="_blank" style="font-size:0.7rem;">语法参考 ↗</a></label>
          <div class="editor-content-area">
            <div class="editor-preview" id="editPreview"></div>
            <textarea class="editor-textarea" id="editContent" placeholder="# 标题

开始写你的想法……

支持 **加粗**、列表、引用、代码块、表格等 Markdown 语法。"></textarea>
          </div>
          <div class="editor-hint" id="wordCount">0 字</div>
        </div>

        <div class="editor-footer">
          <label class="publish-toggle">
            <input type="checkbox" id="editPublished" checked>
            <span class="toggle-track"></span>
            <span id="publishLabel">公开发布</span>
          </label>

          <div class="editor-actions">
            <button class="btn btn-ghost" id="previewBtn">预览</button>
            <button class="btn btn-danger" id="deleteBtn" style="display:none;">删除</button>
            <button class="btn btn-primary" id="saveBtn">保存发布</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="content.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="js/db.js"></script>
  <script>
    /* ============================================
       笔记后台逻辑
       ============================================ */
    const loginView = document.getElementById('loginView');
    const adminView = document.getElementById('adminView');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const setupTip = document.getElementById('setupTip');
    const toast = document.getElementById('toast');

    let notes = [];          // 当前全部笔记（含草稿）
    let currentId = null;    // 正在编辑的笔记 id，null = 新建
    let previewOn = false;

    function showToast(msg, type) {
      toast.textContent = msg;
      toast.className = 'toast show' + (type ? ' ' + type : '');
      setTimeout(() => { toast.className = 'toast'; }, 2600);
    }

    /* ---- 启动：检查配置和登录状态 ---- */
    (async function boot() {
      if (typeof DB === 'undefined' || !DB.ready) {
        loginView.style.display = 'flex';
        setupTip.style.display = 'block';
        loginBtn.disabled = true;
        return;
      }
      const session = await DB.session();
      if (session) {
        enterAdmin();
      } else {
        loginView.style.display = 'flex';
      }
    })();

    /* ---- 登录 ---- */
    async function doLogin() {
      loginError.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = '登录中…';
      try {
        await DB.signIn(
          document.getElementById('loginEmail').value.trim(),
          document.getElementById('loginPassword').value
        );
        enterAdmin();
      } catch (e) {
        loginError.textContent = '登录失败：' + (e.message || '邮箱或密码不对');
        loginError.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '登 录';
      }
    }

    loginBtn.addEventListener('click', doLogin);
    document.getElementById('loginPassword').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await DB.signOut();
      location.reload();
    });

    /* ---- 进入后台 ---- */
    async function enterAdmin() {
      loginView.style.display = 'none';
      adminView.style.display = 'block';
      await refreshList();
    }

    async function refreshList(keepId) {
      const listEl = document.getElementById('adminNotesList');
      try {
        notes = await DB.listAll();
      } catch (e) {
        listEl.innerHTML = '<div class="admin-list-empty">读取失败：' + (e.message || '') + '</div>';
        return;
      }

      if (notes.length === 0) {
        listEl.innerHTML = '<div class="admin-list-empty">还没有笔记，点右上角「＋ 新笔记」开始写第一篇。</div>';
        return;
      }

      listEl.innerHTML = notes.map(n =>
        '<button class="admin-note-item' + (n.id === currentId ? ' active' : '') + '" data-id="' + n.id + '">' +
          '<span class="admin-note-item-title">' +
            '<span class="note-status-dot' + (n.published ? '' : ' draft') + '"></span>' +
            '<span>' + escapeHtml(n.title || '（无标题）') + '</span>' +
          '</span>' +
          '<span class="admin-note-item-meta">' + n.year + '.' + n.month + '.' + n.day + (n.published ? '' : ' · 草稿') + '</span>' +
        '</button>'
      ).join('');

      listEl.querySelectorAll('.admin-note-item').forEach(btn => {
        btn.addEventListener('click', () => loadNote(btn.getAttribute('data-id')));
      });

      if (keepId) {
        const active = listEl.querySelector('[data-id="' + keepId + '"]');
        if (active) active.classList.add('active');
      }
    }

    function escapeHtml(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    /* ---- 加载 / 新建 ---- */
    function loadNote(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      currentId = id;
      document.getElementById('editTitle').value = note.title;
      document.getElementById('editTag').value = note.tag;
      document.getElementById('editExcerpt').value = note.excerpt;
      document.getElementById('editContent').value = note.content;
      document.getElementById('editPublished').checked = note.published;
      document.getElementById('deleteBtn').style.display = '';
      document.getElementById('saveBtn').textContent = '保存修改';
      updateWordCount();
      updatePublishLabel();
      if (previewOn) updatePreview();
      refreshListActive();
    }

    function refreshListActive() {
      document.querySelectorAll('.admin-note-item').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-id') === currentId);
      });
    }

    document.getElementById('newNoteBtn').addEventListener('click', () => {
      currentId = null;
      document.getElementById('editTitle').value = '';
      document.getElementById('editTag').value = '';
      document.getElementById('editExcerpt').value = '';
      document.getElementById('editContent').value = '';
      document.getElementById('editPublished').checked = true;
      document.getElementById('deleteBtn').style.display = 'none';
      document.getElementById('saveBtn').textContent = '保存发布';
      updateWordCount();
      updatePublishLabel();
      refreshListActive();
      document.getElementById('editTitle').focus();
    });

    /* ---- 保存 ---- */
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const data = {
        title: document.getElementById('editTitle').value.trim(),
        tag: document.getElementById('editTag').value.trim(),
        excerpt: document.getElementById('editExcerpt').value.trim(),
        content: document.getElementById('editContent').value,
        published: document.getElementById('editPublished').checked,
      };

      if (!data.title) { showToast('标题不能为空', 'error'); return; }
      if (!data.content.trim()) { showToast('正文不能为空', 'error'); return; }
      if (!data.excerpt) {
        // 没写摘要就自动截取正文前 80 字
        data.excerpt = data.content.replace(/[#>*`\-\[\]()!]/g, '').trim().slice(0, 80) + '…';
      }

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      try {
        if (currentId) {
          await DB.update(currentId, data);
          showToast('已保存修改', 'ok');
        } else {
          await DB.create(data);
          showToast(data.published ? '已发布！网站上立刻能看到' : '已存为草稿', 'ok');
        }
        await refreshList();
        // 新建后选中新笔记
        if (!currentId && notes.length > 0) {
          currentId = notes[0].id;
          loadNote(currentId);
        }
      } catch (e) {
        showToast('保存失败：' + (e.message || ''), 'error');
      } finally {
        saveBtn.disabled = false;
      }
    });

    /* ---- 删除 ---- */
    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!currentId) return;
      if (!confirm('确定删除这篇笔记吗？删除后无法恢复。')) return;
      try {
        await DB.remove(currentId);
        showToast('已删除', 'ok');
        currentId = null;
        document.getElementById('newNoteBtn').click();
        await refreshList();
      } catch (e) {
        showToast('删除失败：' + (e.message || ''), 'error');
      }
    });

    /* ---- 预览 ---- */
    const previewEl = document.getElementById('editPreview');
    const textareaEl = document.getElementById('editContent');

    function updatePreview() {
      previewEl.innerHTML = renderMarkdown(textareaEl.value);
    }

    document.getElementById('previewBtn').addEventListener('click', function () {
      previewOn = !previewOn;
      previewEl.classList.toggle('show', previewOn);
      textareaEl.style.display = previewOn ? 'none' : '';
      this.textContent = previewOn ? '继续编辑' : '预览';
      if (previewOn) updatePreview();
    });

    /* ---- 字数统计 & 发布开关文案 ---- */
    function updateWordCount() {
      const len = textareaEl.value.replace(/\s/g, '').length;
      document.getElementById('wordCount').textContent = len + ' 字';
    }
    textareaEl.addEventListener('input', updateWordCount);

    function updatePublishLabel() {
      const on = document.getElementById('editPublished').checked;
      document.getElementById('publishLabel').textContent = on ? '公开发布' : '存为草稿（仅自己可见）';
    }
    document.getElementById('editPublished').addEventListener('change', updatePublishLabel);
  </script>
</body>
</html>
